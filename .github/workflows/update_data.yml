name: Update Equity Data

on:
  schedule:
    # 10:00 AM EDT (UTC-4) = 14:00 UTC
    # 10:00 AM EST (UTC-5) = 15:00 UTC
    # Using 14:00 UTC for summer (EDT), adjust to 15:00 UTC in winter if needed
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

jobs:
  refresh-ticker-caches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh TSX Ticker Cache
        run: python backend/refresh_tsx_tickers.py

      - name: Refresh NYSE Ticker Cache
        run: python backend/refresh_nyse_tickers.py

      - name: Upload CAD Checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-cad
          path: backend/_checkpoint_CAD.json
          if-no-files-found: ignore

      - name: Upload USD Checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-usd
          path: backend/_checkpoint_USD.json
          if-no-files-found: ignore

  analyze-cad:
    needs: refresh-ticker-caches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download CAD Checkpoint
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-cad
          path: backend/
        continue-on-error: true

      - name: Analyze CAD Stocks
        run: python backend/analyze_stocks.py --region CAD

      - name: Upload CAD Results
        uses: actions/upload-artifact@v4
        with:
          name: results-cad
          path: backend/results_cad.json
          if-no-files-found: ignore

  analyze-usd:
    needs: refresh-ticker-caches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download USD Checkpoint
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-usd
          path: backend/
        continue-on-error: true

      - name: Analyze USD Stocks
        run: python backend/analyze_stocks.py --region USD

      - name: Upload USD Results
        uses: actions/upload-artifact@v4
        with:
          name: results-usd
          path: backend/results_usd.json
          if-no-files-found: ignore

  deploy:
    needs: [analyze-cad, analyze-usd]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download CAD Results
        uses: actions/download-artifact@v4
        with:
          name: results-cad
          path: backend/
        continue-on-error: true

      - name: Download USD Results
        uses: actions/download-artifact@v4
        with:
          name: results-usd
          path: backend/
        continue-on-error: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
